<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Login · Aura</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">

    <link href="/static/css/main.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <main class="d-flex align-items-center justify-content-center min-dvh-100 p-3">
        <div class="card shadow-sm border-0" style="width: 100%; max-width: 380px;">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-2"><img src="/static/images/aura-logo.svg" alt="Aura" class="aura-logo aura-logo-lg"></h1>
                <p class="text-body-secondary text-center mb-2">Server control panel</p>

                {{if .Error}}
                <div class="alert alert-danger py-2" role="alert">{{.Error}}</div>
                {{end}}

                <form method="post" action="/login">
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="text" class="form-control" id="password" name="password" autocomplete="off" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Sign in</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
