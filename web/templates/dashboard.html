{{template "header" .}}
    <main class="container py-5">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0">Dashboard</h1>
            <span class="badge text-bg-secondary" id="dashboard-live">Connecting</span>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-xl-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <h2 class="h6 text-body-secondary text-uppercase mb-0">CPU</h2>
                        <div id="chart-cpu"></div>
                        <div class="small text-body-secondary" id="detail-cpu">&nbsp;</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <h2 class="h6 text-body-secondary text-uppercase mb-0">Memory</h2>
                        <div id="chart-memory"></div>
                        <div class="small text-body-secondary" id="detail-memory">&nbsp;</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <h2 class="h6 text-body-secondary text-uppercase mb-0">Swap</h2>
                        <div id="chart-swap"></div>
                        <div class="small text-body-secondary" id="detail-swap">&nbsp;</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-xl-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <h2 class="h6 text-body-secondary text-uppercase mb-0">Storage</h2>
                        <div id="chart-disk"></div>
                        <div class="small text-body-secondary" id="detail-disk">&nbsp;</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-transparent d-flex align-items-center justify-content-between">
                <h2 class="h6 mb-0">Top processes</h2>
                <div class="btn-group btn-group-sm" role="group" aria-label="Sort processes">
                    <input type="radio" class="btn-check" name="process-sort" id="process-sort-cpu" value="cpu" autocomplete="off" checked>
                    <label class="btn btn-outline-secondary" for="process-sort-cpu">CPU</label>
                    <input type="radio" class="btn-check" name="process-sort" id="process-sort-memory" value="memory" autocomplete="off">
                    <label class="btn btn-outline-secondary" for="process-sort-memory">Memory</label>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-sm align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-3">PID</th>
                            <th>Name</th>
                            <th>User</th>
                            <th>State</th>
                            <th class="text-end">CPU</th>
                            <th class="text-end">Memory</th>
                            <th class="text-end pe-3">RAM</th>
                        </tr>
                    </thead>
                    <tbody id="process-rows">
                        <tr><td colspan="7" class="text-center text-body-secondary py-4">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
{{template "footer" .}}
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
    <script>
        $(function () {
            var statsInterval = 3000;

            function radialChart(selector, color) {
                var chart = new ApexCharts(document.querySelector(selector), {
                    chart: {
                        type: 'radialBar',
                        height: 260,
                        background: 'transparent',
                        animations: { enabled: true, dynamicAnimation: { enabled: true, speed: 600 } }
                    },
                    theme: { mode: 'dark' },
                    series: [0],
                    colors: [color],
                    plotOptions: {
                        radialBar: {
                            hollow: { size: '65%' },
                            track: { background: '#2b3035', strokeWidth: '100%' },
                            dataLabels: {
                                name: { show: false },
                                value: {
                                    show: true,
                                    offsetY: 8,
                                    fontSize: '28px',
                                    fontWeight: 600,
                                    color: '#dee2e6',
                                    formatter: function (val) {
                                        return Number(val).toFixed(1) + '%';
                                    }
                                }
                            }
                        }
                    },
                    stroke: { lineCap: 'round' },
                    labels: ['Usage']
                });
                chart.render();
                return chart;
            }

            var charts = {
                cpu: radialChart('#chart-cpu', '#0d6efd'),
                memory: radialChart('#chart-memory', '#20c997'),
                swap: radialChart('#chart-swap', '#6f42c1'),
                disk: radialChart('#chart-disk', '#fd7e14')
            };

            var processSort = 'cpu';
            var pending = null;
            var timer = null;

            function renderProcesses(processes) {
                var rows = $('#process-rows').empty();
                if (!processes || processes.length === 0) {
                    rows.append($('<tr>').append($('<td>', { colspan: 7, 'class': 'text-center text-body-secondary py-4' }).text('No processes found.')));
                    return;
                }
                $.each(processes, function (i, process) {
                    rows.append($('<tr>').append(
                        $('<td>', { 'class': 'ps-3 text-body-secondary' }).text(process.pid),
                        $('<td>', { 'class': 'fw-semibold' }).text(process.name),
                        $('<td>').text(process.user),
                        $('<td>').text(process.state),
                        $('<td>', { 'class': 'text-end' }).text(process.cpu.toFixed(1) + '%'),
                        $('<td>', { 'class': 'text-end' }).text(process.memPercent.toFixed(1) + '%'),
                        $('<td>', { 'class': 'text-end pe-3' }).text(formatBytes(process.memory))
                    ));
                });
            }

            function formatBytes(bytes) {
                var units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
                var i = 0;
                var value = bytes;
                while (value >= 1024 && i < units.length - 1) {
                    value /= 1024;
                    i++;
                }
                return value.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
            }

            function setLive(ok) {
                $('#dashboard-live')
                    .toggleClass('text-bg-success', ok)
                    .toggleClass('text-bg-danger', !ok)
                    .removeClass('text-bg-secondary')
                    .text(ok ? 'Live' : 'Offline');
            }

            function schedule(delay) {
                clearTimeout(timer);
                timer = setTimeout(refreshStats, delay);
            }

            function refreshStats() {
                if (document.hidden) {
                    schedule(statsInterval);
                    return;
                }
                if (pending) {
                    pending.abort();
                }
                pending = $.ajax({ url: '/dashboard/stats', data: { sort: processSort }, cache: false, dataType: 'text' });
                pending
                    .done(function (body, status, xhr) {
                        if (!xhr.getResponseHeader('X-Dashboard-Stats')) {
                            location.reload();
                            return;
                        }
                        var stats = JSON.parse(body);
                        charts.cpu.updateSeries([stats.cpu]);
                        charts.memory.updateSeries([stats.memPercent]);
                        charts.swap.updateSeries([stats.swapPercent]);
                        charts.disk.updateSeries([stats.diskPercent]);
                        $('#detail-cpu').text('Current load');
                        $('#detail-memory').text(formatBytes(stats.memUsed) + ' / ' + formatBytes(stats.memTotal));
                        $('#detail-swap').text(stats.swapTotal > 0 ? formatBytes(stats.swapUsed) + ' / ' + formatBytes(stats.swapTotal) : 'No swap configured');
                        $('#detail-disk').text(formatBytes(stats.diskUsed) + ' / ' + formatBytes(stats.diskTotal));
                        renderProcesses(stats.processes);
                        setLive(true);
                        schedule(statsInterval);
                    })
                    .fail(function (xhr, status) {
                        if (status === 'abort') {
                            return;
                        }
                        setLive(false);
                        schedule(statsInterval);
                    })
                    .always(function () {
                        pending = null;
                    });
            }

            $('input[name="process-sort"]').on('change', function () {
                processSort = $(this).val();
                refreshStats();
            });

            refreshStats();
        });
    </script>
