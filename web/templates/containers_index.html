{{template "header" .}}
    <main class="container py-5">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0">Containers</h1>
            <span class="badge text-bg-secondary" id="containers-live">Live</span>
        </div>

        {{with .Data.Flash}}
        <div class="alert alert-{{$.Data.FlashType}} alert-dismissible fade show" role="alert">
            {{.}}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {{end}}

        <div class="card shadow-sm border-0" id="containers-list">
{{template "containers_list" .Data.List}}
        </div>
{{template "containers_terminals"}}
    </main>
{{template "footer" .}}
{{template "containers_terminals_script"}}
    <script>
        $(function () {
            var listInterval = 3000;

            function setListLive(ok) {
                $('#containers-live')
                    .toggleClass('text-bg-success', ok)
                    .toggleClass('text-bg-danger', !ok)
                    .removeClass('text-bg-secondary')
                    .text(ok ? 'Live' : 'Offline');
            }

            function refreshList() {
                if (document.hidden) {
                    setTimeout(refreshList, listInterval);
                    return;
                }
                $.ajax({ url: '/containers/list', cache: false })
                    .done(function (html, status, xhr) {
                        if (!xhr.getResponseHeader('X-Containers-List')) {
                            location.reload();
                            return;
                        }
                        $('#containers-list').html(html);
                        setListLive(true);
                    })
                    .fail(function () {
                        setListLive(false);
                    })
                    .always(function () {
                        setTimeout(refreshList, listInterval);
                    });
            }

            setTimeout(refreshList, listInterval);
        });
    </script>
