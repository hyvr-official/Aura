{{template "header" .}}
    <main class="container py-4">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="h5 mb-0">Containers <span class="badge-live-status text-secondary" id="containers-live"><i class="ri-circle-fill"></i></span></h1>
        </div>

        {{with .Data.Flash}}<span hidden data-toast="{{$.Data.FlashType}}">{{.}}</span>{{end}}

        <div class="card shadow-sm border-0" id="containers-list">
{{template "containers_list" .Data.List}}
        </div>
{{template "containers_terminals"}}
    </main>
{{template "footer" .}}
{{template "containers_terminals_script"}}
    <script>
        $(function () {
            var listInterval = 3000;

            function setListLive(ok) {
                $('#containers-live')
                    .toggleClass('text-success', ok)
                    .toggleClass('text-danger', !ok)
                    .removeClass('text-secondary');
            }

            function initDropdowns() {
                $('#containers-list [data-bs-toggle="dropdown"]').each(function () {
                    bootstrap.Dropdown.getOrCreateInstance(this, { popperConfig: { strategy: 'fixed' } });
                });
            }

            function refreshList() {
                if (document.hidden || $('#containers-list .dropdown-menu.show').length) {
                    setTimeout(refreshList, listInterval);
                    return;
                }
                $.ajax({ url: '/containers/list', cache: false })
                    .done(function (html, status, xhr) {
                        if (!xhr.getResponseHeader('X-Containers-List')) {
                            location.reload();
                            return;
                        }
                        var $list = $('#containers-list');
                        if ($list.find('.dropdown-menu.show').length) {
                            setListLive(true);
                            return;
                        }
                        var $oldScroller = $list.find('.table-responsive');
                        var scrollLeft = $oldScroller.scrollLeft() || 0;
                        var scrollTop = $oldScroller.scrollTop() || 0;
                        $list.css('min-height', $list.outerHeight());
                        $list.html(html);
                        $list.find('.table-responsive').scrollLeft(scrollLeft).scrollTop(scrollTop);
                        $list.css('min-height', '');
                        initDropdowns();
                        setListLive(true);
                    })
                    .fail(function () {
                        setListLive(false);
                    })
                    .always(function () {
                        setTimeout(refreshList, listInterval);
                    });
            }

            initDropdowns();
            setTimeout(refreshList, listInterval);
        });
    </script>
