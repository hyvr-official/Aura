{{define "header"}}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{.Title}} · Aura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-body border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Aura</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link{{if eq .Active "dashboard"}} active{{end}}" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link{{if eq .Active "backups"}} active{{end}}" href="/backups">Backups</a></li>
                <li class="nav-item"><a class="nav-link{{if eq .Active "containers"}} active{{end}}" href="/containers">Containers</a></li>
                <li class="nav-item"><a class="nav-link{{if eq .Active "volumes"}} active{{end}}" href="/volumes">Volumes</a></li>
                <li class="nav-item"><a class="nav-link{{if eq .Active "files"}} active{{end}}" href="/files">File Manager</a></li>
                <li class="nav-item"><a class="nav-link{{if eq .Active "proxy"}} active{{end}}" href="/proxy">Reverse Proxy</a></li>
                <li class="nav-item"><a class="nav-link{{if eq .Active "repositories"}} active{{end}}" href="/repositories">Repositories</a></li>
                <li class="nav-item"><a class="nav-link{{if eq .Active "projects"}} active{{end}}" href="/projects">Projects</a></li>
                <li class="nav-item"><a class="nav-link{{if eq .Active "console"}} active{{end}}" href="/console">Console</a></li>
                <li class="nav-item"><a class="nav-link{{if eq .Active "settings"}} active{{end}}" href="/settings">Settings</a></li>
            </ul>
            <form method="post" action="/logout" class="d-flex py-2 py-lg-0">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
            </form>
            </div>
        </div>
    </nav>
{{end}}

{{define "footer"}}
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{{end}}
