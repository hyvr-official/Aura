{{define "header"}}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{.Title}} · Aura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root { --aura-navbar-height: 3.75rem; }
        .app-navbar { height: var(--aura-navbar-height); }
        .app-sidebar { --bs-offcanvas-width: 260px; }
        .app-sidebar .nav-link { display: flex; align-items: center; gap: .75rem; color: var(--bs-body-color); padding: .55rem .85rem; }
        .app-sidebar .nav-link i { font-size: 1.15rem; line-height: 1; color: var(--bs-secondary-color); }
        .app-sidebar .nav-link:hover { background-color: var(--bs-tertiary-bg); }
        .app-sidebar .nav-link.active { background-color: rgba(var(--bs-primary-rgb), .15); color: var(--bs-primary-text-emphasis); }
        .app-sidebar .nav-link.active i { color: var(--bs-primary-text-emphasis); }
        .app-content { min-width: 0; }
        .nav-gauge-chart { width: 40px; height: 40px; }
        .nav-gauge-label { line-height: 1.1; min-width: 2.75rem; }
        @media (min-width: 992px) {
            .app-sidebar { width: 240px; flex-shrink: 0; position: sticky; top: var(--aura-navbar-height); height: calc(100vh - var(--aura-navbar-height)); overflow-y: auto; background-color: var(--bs-body-bg) !important; }
        }
    </style>
</head>
<body class="bg-body-tertiary">
    <nav class="navbar app-navbar bg-body border-bottom sticky-top py-0">
        <div class="container-fluid h-100 flex-nowrap">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-link link-body-emphasis p-1 d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Toggle navigation">
                    <i class="ri-menu-line fs-4"></i>
                </button>
                <a class="navbar-brand fw-bold d-flex align-items-center gap-2 me-0" href="/"><i class="ri-shining-2-fill text-primary"></i>Aura</a>
            </div>
            <div class="ms-auto d-flex align-items-center gap-2 gap-sm-3">
                <div class="d-flex align-items-center" id="nav-gauge-cpu" title="CPU usage">
                    <div class="nav-gauge-chart" id="nav-chart-cpu"></div>
                    <div class="nav-gauge-label small d-none d-sm-block">
                        <div class="text-body-secondary text-uppercase" style="font-size: .7rem;">CPU</div>
                        <div class="fw-semibold" id="nav-cpu-value">–</div>
                    </div>
                </div>
                <div class="d-flex align-items-center" id="nav-gauge-memory" title="Memory usage">
                    <div class="nav-gauge-chart" id="nav-chart-memory"></div>
                    <div class="nav-gauge-label small d-none d-sm-block">
                        <div class="text-body-secondary text-uppercase" style="font-size: .7rem;">RAM</div>
                        <div class="fw-semibold" id="nav-memory-value">–</div>
                    </div>
                </div>
                <form method="post" action="/logout" class="d-flex">
                    <button type="submit" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" title="Log out"><i class="ri-logout-box-r-line"></i><span class="d-none d-sm-inline">Log out</span></button>
                </form>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <aside class="offcanvas-lg offcanvas-start app-sidebar bg-body border-end" tabindex="-1" id="sidebar" aria-labelledby="sidebar-label">
            <div class="offcanvas-header border-bottom">
                <h5 class="offcanvas-title fw-bold d-flex align-items-center gap-2" id="sidebar-label"><i class="ri-shining-2-fill text-primary"></i>Aura</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body p-3">
                <ul class="nav nav-pills flex-column gap-1 w-100">
                    <li class="nav-item"><a class="nav-link{{if eq .Active "dashboard"}} active{{end}}" href="/"><i class="ri-dashboard-3-line"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link{{if eq .Active "backups"}} active{{end}}" href="/backups"><i class="ri-archive-line"></i>Backups</a></li>
                    <li class="nav-item"><a class="nav-link{{if eq .Active "containers"}} active{{end}}" href="/containers"><i class="ri-box-3-line"></i>Containers</a></li>
                    <li class="nav-item"><a class="nav-link{{if eq .Active "volumes"}} active{{end}}" href="/volumes"><i class="ri-hard-drive-3-line"></i>Volumes</a></li>
                    <li class="nav-item"><a class="nav-link{{if eq .Active "files"}} active{{end}}" href="/files"><i class="ri-folder-3-line"></i>File Manager</a></li>
                    <li class="nav-item"><a class="nav-link{{if eq .Active "proxy"}} active{{end}}" href="/proxy"><i class="ri-global-line"></i>Reverse Proxy</a></li>
                    <li class="nav-item"><a class="nav-link{{if eq .Active "repositories"}} active{{end}}" href="/repositories"><i class="ri-git-repository-line"></i>Repositories</a></li>
                    <li class="nav-item"><a class="nav-link{{if eq .Active "projects"}} active{{end}}" href="/projects"><i class="ri-stack-line"></i>Projects</a></li>
                    <li class="nav-item"><a class="nav-link{{if eq .Active "console"}} active{{end}}" href="/console"><i class="ri-terminal-box-line"></i>Console</a></li>
                    <li class="nav-item"><a class="nav-link{{if eq .Active "settings"}} active{{end}}" href="/settings"><i class="ri-settings-3-line"></i>Settings</a></li>
                </ul>
            </div>
        </aside>
        <div class="app-content flex-grow-1">
{{end}}

{{define "footer"}}
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
    <script>
        $(function () {
            var usageInterval = 5000;
            var usagePending = null;
            var usageTimer = null;

            function navGauge(selector, color) {
                var chart = new ApexCharts(document.querySelector(selector), {
                    chart: {
                        type: 'radialBar',
                        height: 40,
                        width: 40,
                        sparkline: { enabled: true },
                        background: 'transparent',
                        animations: { enabled: true, dynamicAnimation: { enabled: true, speed: 600 } }
                    },
                    theme: { mode: 'dark' },
                    series: [0],
                    colors: [color],
                    plotOptions: {
                        radialBar: {
                            hollow: { size: '45%' },
                            track: { background: '#2b3035', strokeWidth: '100%' },
                            dataLabels: { show: false }
                        }
                    },
                    stroke: { lineCap: 'round' },
                    tooltip: { enabled: false },
                    states: { hover: { filter: { type: 'none' } }, active: { filter: { type: 'none' } } }
                });
                chart.render();
                return chart;
            }

            function navFormatBytes(bytes) {
                var units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
                var i = 0;
                var value = bytes;
                while (value >= 1024 && i < units.length - 1) {
                    value /= 1024;
                    i++;
                }
                return value.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
            }

            var navCharts = {
                cpu: navGauge('#nav-chart-cpu', '#0d6efd'),
                memory: navGauge('#nav-chart-memory', '#20c997')
            };

            function scheduleUsage(delay) {
                clearTimeout(usageTimer);
                usageTimer = setTimeout(refreshUsage, delay);
            }

            function refreshUsage() {
                if (document.hidden) {
                    scheduleUsage(usageInterval);
                    return;
                }
                if (usagePending) {
                    usagePending.abort();
                }
                usagePending = $.ajax({ url: '/system/usage', cache: false, dataType: 'text' });
                usagePending
                    .done(function (body, status, xhr) {
                        if (!xhr.getResponseHeader('X-System-Usage')) {
                            location.reload();
                            return;
                        }
                        var usage = JSON.parse(body);
                        navCharts.cpu.updateSeries([usage.cpu]);
                        navCharts.memory.updateSeries([usage.memPercent]);
                        $('#nav-cpu-value').text(usage.cpu.toFixed(0) + '%');
                        $('#nav-memory-value').text(usage.memPercent.toFixed(0) + '%');
                        $('#nav-gauge-cpu').attr('title', 'CPU usage: ' + usage.cpu.toFixed(1) + '%');
                        $('#nav-gauge-memory').attr('title', 'Memory usage: ' + navFormatBytes(usage.memUsed) + ' / ' + navFormatBytes(usage.memTotal));
                        scheduleUsage(usageInterval);
                    })
                    .fail(function (xhr, status) {
                        if (status === 'abort') {
                            return;
                        }
                        scheduleUsage(usageInterval);
                    })
                    .always(function () {
                        usagePending = null;
                    });
            }

            refreshUsage();
        });
    </script>
</body>
</html>
{{end}}
