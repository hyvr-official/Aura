<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Setup · Aura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <main class="d-flex align-items-center justify-content-center min-vh-100 p-3">
        <div class="card shadow-sm border-0" style="width: 100%; max-width: 380px;">
            <div class="card-body p-4">
                <h1 class="h3 fw-bold text-center mb-1">Aura</h1>
                <p class="text-body-secondary text-center mb-4">Set an admin password to get started</p>

                {{if .Error}}
                <div class="alert alert-danger py-2" role="alert">{{.Error}}</div>
                {{end}}

                <form method="post" action="/setup">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="password" name="password" placeholder="Password" autocomplete="off" required autofocus>
                        <label for="password">Password</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="password_confirm" name="password_confirm" placeholder="Confirm password" autocomplete="off" required>
                        <label for="password_confirm">Confirm password</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Save password</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
